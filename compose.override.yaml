services:
  midtable-api:
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend/app:/app/app
    environment:
      # Reliable file watching on Docker Desktop (Windows/macOS)
      WATCHFILES_FORCE_POLLING: "true"
