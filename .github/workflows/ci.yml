name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.5.0"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
          NEXT_PUBLIC_TURNSTILE_SITEKEY: 1x00000000000000000000AA
          INTERNAL_API_SECRET: test-internal-secret

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t midtable-api ./backend
      - name: Build frontend image
        run: |
          docker build -f frontend/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321 \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=test-publishable-key \
            --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 \
            --build-arg NEXT_PUBLIC_TURNSTILE_SITEKEY=1x00000000000000000000AA \
            -t midtable-frontend .
