# External cron against the hosted API (Cloud Run).
# Secrets: API_URL = API origin only (e.g. https://midtable-api-….run.app);
# the path /internal/sync-and-score is appended below. CRON_SECRET must match the API.
name: Sync and score

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours at :55 UTC (00:55, 02:55, …, 22:55)
    - cron: "55 */2 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST "${API_URL}/internal/sync-and-score" \
            -H "X-Cron-Secret: ${CRON_SECRET}"
