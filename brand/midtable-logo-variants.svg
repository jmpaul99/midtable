<svg width="880" height="520" viewBox="0 0 880 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Midtable logo variants Matchday and Pitch Night">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap');
      .midtable-text {
        font-family: 'Outfit', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .label {
        font-family: 'Outfit', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .swatch-hex {
        font-family: 'Outfit', 'Segoe UI', ui-sans-serif, system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    ]]></style>

    <linearGradient id="rank-frame-matchday" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FD94A"/>
      <stop offset="100%" stop-color="#B9CDC0"/>
    </linearGradient>

    <linearGradient id="rank-frame-pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8F25A"/>
      <stop offset="100%" stop-color="#9EE9D0"/>
    </linearGradient>

    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>

    <filter id="card-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feFlood flood-color="#2DD67B" flood-opacity="0.45" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="softGlow"/>
      <feMerge>
        <feMergeNode in="softGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g>
    <rect x="0" y="0" width="440" height="520" fill="#F4F4F5"/>

    <text x="220" y="48" text-anchor="middle" font-size="13" fill="#71717A" class="label">Matchday</text>
    <text x="220" y="68" text-anchor="middle" font-size="11" fill="#B9CDC0" class="swatch-hex">frame #8FD94A - #B9CDC0</text>

    <rect x="80" y="100" width="280" height="280" rx="28" fill="#FFFFFF" filter="url(#soft-shadow)"/>

    <g transform="translate(220, 208)">
      <text font-size="46" fill="#71717A" class="midtable-text">
        <tspan x="-94" y="-4">Mid</tspan>
        <tspan x="-8" y="4">table</tspan>
      </text>

      <g transform="translate(0, 36)">
        <rect x="-73" y="12" width="36" height="36" fill="#067A4A"/>
        <rect x="-27" y="-6" width="54" height="54" fill="url(#rank-frame-matchday)"/>
        <rect x="-22" y="-1" width="44" height="44" fill="#FFFFFF"/>
        <rect x="-18" y="3" width="36" height="36" fill="#067A4A"/>
        <rect x="37" y="12" width="36" height="36" fill="#067A4A"/>
      </g>
    </g>

    <g transform="translate(128, 430)">
      <rect width="36" height="36" rx="8" fill="#71717A"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#71717A" class="swatch-hex">#71717A</text>
    </g>
    <g transform="translate(184, 430)">
      <rect width="36" height="36" rx="8" fill="#067A4A"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#067A4A" class="swatch-hex">#067A4A</text>
    </g>
    <g transform="translate(240, 430)">
      <rect width="36" height="36" rx="8" fill="#8FD94A"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#71717A" class="swatch-hex">#8FD94A</text>
    </g>
    <g transform="translate(296, 430)">
      <rect width="36" height="36" rx="8" fill="#B9CDC0"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#71717A" class="swatch-hex">#B9CDC0</text>
    </g>
  </g>

  <g transform="translate(440, 0)">
    <rect width="440" height="520" fill="#0A0F0C"/>

    <text x="220" y="48" text-anchor="middle" font-size="13" fill="#E8EEE9" class="label">Pitch Night</text>
    <text x="220" y="68" text-anchor="middle" font-size="11" fill="#2DD67B" class="swatch-hex">frame #B8F25A - #9EE9D0</text>

    <rect x="80" y="100" width="280" height="280" rx="28" fill="#121A15" filter="url(#card-glow)"/>

    <g transform="translate(220, 208)">
      <text font-size="46" fill="#2DD67B" class="midtable-text">
        <tspan x="-94" y="-4">Mid</tspan>
        <tspan x="-8" y="4">table</tspan>
      </text>

      <g transform="translate(0, 36)">
        <rect x="-73" y="12" width="36" height="36" fill="#2DD67B"/>
        <rect x="-27" y="-6" width="54" height="54" fill="url(#rank-frame-pitch)"/>
        <rect x="-22" y="-1" width="44" height="44" fill="#121A15"/>
        <rect x="-18" y="3" width="36" height="36" fill="#2DD67B"/>
        <rect x="37" y="12" width="36" height="36" fill="#2DD67B"/>
      </g>
    </g>

    <g transform="translate(128, 430)">
      <rect width="36" height="36" rx="8" fill="#2DD67B"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#2DD67B" class="swatch-hex">#2DD67B</text>
    </g>
    <g transform="translate(202, 430)">
      <rect width="36" height="36" rx="8" fill="#B8F25A"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#B8F25A" class="swatch-hex">#B8F25A</text>
    </g>
    <g transform="translate(276, 430)">
      <rect width="36" height="36" rx="8" fill="#9EE9D0"/>
      <text x="18" y="56" text-anchor="middle" font-size="11" fill="#9EE9D0" class="swatch-hex">#9EE9D0</text>
    </g>
  </g>
</svg>
